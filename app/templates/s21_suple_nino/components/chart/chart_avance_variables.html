<div class="card">
  <div class="card-header">
    <h3 class="card-title">
      <i class="fas fa-child mr-1"></i>
      NIÑOS SIN BAJO PESO Y SIN PREMATURIDAD
    </h3>
    <div class="card-tools">
      <button type="button" class="btn btn-tool" data-card-widget="collapse">
        <i class="fas fa-minus"></i>
      </button>
    </div>
  </div>
  <div class="card-body">
    <div id="chart-trimestre" style="min-height: 250px"></div>
  </div>
</div>

<script>
  window.renderChartAvanceVariables = function (data, params) {
    if (typeof echarts === "undefined") {
      console.error("ECharts no está cargado.");
      return;
    }

    const chartDOMElements = {
      trimestre: document.getElementById("chart-trimestre"),
    };

    const charts = {};

    function createOrUpdateChart(chartKey, labels, chartData) {
      const chartDOMElement = chartDOMElements[chartKey];
      if (!chartDOMElement) return;

      let chartInstance = echarts.getInstanceByDom(chartDOMElement);
      if (chartInstance) {
        chartInstance.dispose();
      }
      chartInstance = echarts.init(chartDOMElement);
      charts[chartKey] = chartInstance;

      const option = {
        tooltip: {
          trigger: "axis",
          axisPointer: { type: "shadow" },
          formatter: function (params) {
            const dataItem = params[0].data;
            return `Alcanzado: ${
              dataItem.numerator
            }<br/>Avance: ${dataItem.value.toFixed(1)}%`;
          },
        },
        toolbox: { feature: { saveAsImage: {} } },
        xAxis: {
          type: "category",
          data: labels,
          axisLabel: { rotate: 45, fontSize: 8 },
        },
        yAxis: {
          type: "value",
          max: 100,
          axisLabel: { formatter: "{value}%", fontSize: 8 },
        },
        series: [
          {
            name: "Avance",
            type: "bar",
            data: chartData,
            itemStyle: { color: "#5070dd" },
            label: {
              show: true,
              position: "top",
              formatter: function (params) {
                return params.data.numerator;
              },
              fontSize: 8,
              color: "black",
              fontWeight: "bold",
            },
            markLine: {
              symbol: "none",
              lineStyle: { type: "dashed", color: "red" },
              data: [{ yAxis: 88, name: "M" }],
              label: {
                show: true,
                formatter: `M: 88%`,
                position: "end",
                offset: [0, -14],
                textStyle: { fontSize: 8 },
              },
            },
          },
        ],
      };
      chartInstance.setOption(option);
    }

    try {
      console.log("📊 Datos recibidos en renderChartAvanceVariables:", data);

      // Logs detallados de los datos recibidos
      console.log("🔍 Valores brutos recibidos:");
      console.log(
        "  - den_variable:",
        data.den_variable,
        "tipo:",
        typeof data.den_variable,
        "es array:",
        Array.isArray(data.den_variable),
      );
      console.log(
        "  - num_hierro4m:",
        data.num_hierro4m,
        "tipo:",
        typeof data.num_hierro4m,
        "es array:",
        Array.isArray(data.num_hierro4m),
      );
      console.log(
        "  - num_hb6m:",
        data.num_hb6m,
        "tipo:",
        typeof data.num_hb6m,
        "es array:",
        Array.isArray(data.num_hb6m),
      );
      console.log(
        "  - avance_hierro4m:",
        data.avance_hierro4m,
        "tipo:",
        typeof data.avance_hierro4m,
        "es array:",
        Array.isArray(data.avance_hierro4m),
      );
      console.log(
        "  - avance_hb6m:",
        data.avance_hb6m,
        "tipo:",
        typeof data.avance_hb6m,
        "es array:",
        Array.isArray(data.avance_hb6m),
      );

      const extractValue = (rawValue) => {
        if (rawValue == null) return 0;
        // Si es un array, tomar el primer elemento
        const value = Array.isArray(rawValue) ? rawValue[0] : rawValue;
        const numValue = parseFloat(value) || 0;
        return numValue;
      };

      const indicatorGroups = {
        trimestre: [
          {
            title: "4 meses",
            avance_key: "avance_hierro4m",
            num_key: "num_hierro4m",
          },
          {
            title: "6 meses",
            avance_key: "avance_hb6m",
            num_key: "num_hb6m",
          },
        ],
      };

      const specialColor = "#5070dd";

      for (const group in indicatorGroups) {
        const labels = indicatorGroups[group].map((item) => item.title);
        const chartData = indicatorGroups[group].map((item, index) => {
          const value = extractValue(data[item.avance_key]);
          const numerator = extractValue(data[item.num_key]);

          const dataItem = { value: value, numerator: numerator };
          if (index === 0) {
            dataItem.itemStyle = { color: specialColor };
          }
          return dataItem;
        });

        console.log("✅ Datos del gráfico procesados:", chartData);
        createOrUpdateChart(group, labels, chartData);
      }
    } catch (error) {
      console.error("❌ Error al renderizar los gráficos de variables:", error);
    }

    window.addEventListener("resize", function () {
      for (const key in charts) {
        if (charts[key]) {
          charts[key].resize();
        }
      }
    });
  };
</script>
